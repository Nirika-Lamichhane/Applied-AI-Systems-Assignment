version: '3.8'

services:
  backend:
    build: ./backend
    container_name: task1_backend_service
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build: ./frontend
    container_name: task2_frontend_service
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always